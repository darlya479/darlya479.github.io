<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8050 스토리텔링 - Frame 2 & 3</title>
  <!-- Google Fonts: Hahmlet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- 외부 CSS 연결 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="stage">
    <aside class="tool-controls">
      <button id="btn-hand" class="ui-btn circle-btn" aria-label="손바닥 커서 모드" title="손바닥 도구">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
      </button>

      <button id="btn-flashlight" class="ui-btn circle-btn" aria-label="손전등 커서 모드" title="손전등 도구">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6c0 2-2 2-2 4v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V10c0-2-2-2-2-4V2h12z"/>
          <line x1="6" y1="6" x2="18" y2="6"/>
          <line x1="12" y1="12" x2="12" y2="12"/>
        </svg>
      </button>
    </aside>

    <section class="content-wrapper">
      <div class="image-frame" id="image-frame">
        <!-- images 폴더 안의 사진 경로로 수정됨 -->
        <img src="images/photo.png" alt="1990년대 일본 취업 빙하기" id="story-image">
      </div>

      <div class="text-container">
        <p id="story-text" class="story-text">
          일본에서는 1990년대 버블 붕괴 이후 취업 빙하기를 겪었다.
        </p>
      </div>
    </section>

    <nav class="nav-controls">
      <button id="btn-prev" class="ui-btn arrow-btn" aria-label="이전 장면" disabled>
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <button id="btn-next" class="ui-btn arrow-btn" aria-label="다음 장면">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
    </nav>
  </main>

  <!-- 외부 JS 연결 -->
  <script src="js/script.js"></script>
</body>
</html>
